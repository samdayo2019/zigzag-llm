name: tpu_8b

# TPUv4i specs
# 1050MHz
# 128x128 SA
# 144MB @ 2000 GB/s R, 1000 GB/s W
# DRAM @ 614 GB/s

# Energy Costs
# DRAM: 5.5 pJ/bit
# SRAM: .21 pJ/bit
# int8 mult: .07 pJ/bit

# cycle = 9.524E-10 seconds
# DRAM bits/cycle = 614 GB/s * 9.524E-10s = 4678 bits
# DRAM energy = (4678 * 5.5) pJ/cycle = 25729 
# SRAM bits/cycle = 2000 GB/s * 9.524E-10s = 15238 bits
# SRAM energy = (15238 * .21) pJ/cycle = 3200

memories:
  rf_I:
    size: 8
    r_bw: 8
    w_bw: 8
    r_cost: 0.2
    w_cost: 0.2
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 8
    min_w_granularity: 8
    operands: [I1]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: []

  rf_W: # For MatMul, this will store activations
    size: 8
    r_bw: 8
    w_bw: 8
    r_cost: 0.2
    w_cost: 0.2
    area: 0
    r_port: 1
    w_port: 1
    rw_port: 0
    latency: 1
    min_r_granularity: 4
    min_w_granularity: 4
    operands: [I2]
    ports:
      - fh: w_port_1
        tl: r_port_1
    served_dimensions: []

  rf_O:
    size: 16
    r_bw: 16
    w_bw: 16
    r_cost: 0.4
    w_cost: 0.4
    area: 0
    r_port: 2
    w_port: 2
    rw_port: 0
    latency: 1
    min_r_granularity: 16
    min_w_granularity: 16
    operands: [O]
    ports:
      - fh: w_port_1
        tl: r_port_1
        fl: w_port_2
        th: r_port_2
    served_dimensions: []

  sram_144MB:
    size: 1152000000
    r_bw: 15238
    w_bw: 15238 
    r_cost: 3200 
    w_cost: 3200 
    area: 0
    r_port: 3
    w_port: 3
    rw_port: 0
    latency: 1
    operands: [I1, I2, O]
    ports:
      - fh: w_port_1
        tl: r_port_1
      - fh: w_port_2
        tl: r_port_2
      - fh: w_port_3
        tl: r_port_3
        fl: w_port_3
        th: r_port_3
    served_dimensions: [D1, D2]

  dram:
    size: 10000000000000000
    r_bw: 4678
    w_bw: 4678
    r_cost: 25700
    w_cost: 25700
    area: 0
    r_port: 0
    w_port: 0
    rw_port: 1
    latency: 1
    operands: [I1, I2, O]
    ports:
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
      - fh: rw_port_1
        tl: rw_port_1
        fl: rw_port_1
        th: rw_port_1
    served_dimensions: [D1, D2]

operational_array:
  input_precision: [8, 8]
  multiplier_energy: .07
  multiplier_area: 1
  dimensions: [D1, D2]
  sizes: [128, 128]